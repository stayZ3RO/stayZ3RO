---
name: validate

on:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            gzip \
            tar

      - name: Install gitleaks and lychee
        run: |
          set -euo pipefail
          tools="$(mktemp -d "${RUNNER_TEMP:-/tmp}/forgejo-tools.XXXXXX")"
          case "$(uname -m)" in
            x86_64)
              gitleaks_arch=x64
              gitleaks_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              lychee_arch=x86_64
              lychee_sha=1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
              ;;
            aarch64|arm64)
              gitleaks_arch=arm64
              gitleaks_sha=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
              lychee_arch=aarch64
              lychee_sha=91a7bd65685da41b90ccb9bc867a3d649a7818042dae04ff405e55a25bddee4c
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "$tools/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${gitleaks_arch}.tar.gz"
          printf '%s  %s\n' "$gitleaks_sha" "$tools/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$tools/gitleaks.tgz" -C "$tools" gitleaks
          chmod +x "$tools/gitleaks"
          curl -fsSL -o "$tools/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-${lychee_arch}-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$lychee_sha" "$tools/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$tools/lychee.tar.gz" -C "$tools"
          mv "$tools/lychee-${lychee_arch}-unknown-linux-gnu/lychee" "$tools/lychee"
          chmod +x "$tools/lychee"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Secret scan
        run: gitleaks git . --redact --no-banner

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.18.1 --config .github/.markdownlint-cli2.jsonc '**/*.md'

      - name: Check links
        run: |
          set -euo pipefail
          mapfile -t markdown_files < <(find . -name '*.md' -not -path './.git/*' -print)
          lychee --exclude-all-private --no-progress --max-retries 2 --timeout 20 "${markdown_files[@]}"
